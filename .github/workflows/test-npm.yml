name: Test npm Auth Config

on:
  workflow_dispatch:

jobs:
  npm-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js with registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Normalize npm auth config
        run: |
          set -euo pipefail
          CONFIG_FILE="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "Using npm config: $CONFIG_FILE"
          touch "$CONFIG_FILE"
          tmp="$(mktemp)"
          grep -v '^always-auth[[:space:]]*=' "$CONFIG_FILE" > "$tmp" || true
          mv "$tmp" "$CONFIG_FILE"
          if ! grep -q '^//registry.npmjs.org/:always-auth' "$CONFIG_FILE"; then
            printf '//registry.npmjs.org/:always-auth=true\n' >> "$CONFIG_FILE"
          fi
          echo "Updated npm config:"
          cat "$CONFIG_FILE"

      - name: Validate npm commands run cleanly
        run: |
          npm --version
          npm config get //registry.npmjs.org/:always-auth
          echo "Installing npm@11.6.0 globally to verify no warnings are emitted…"
          npm i -g npm@11.6.0
